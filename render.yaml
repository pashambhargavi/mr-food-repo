services:
  - type: web
    name: sweet-shop-backend
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: "Anandam Sweets API"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
